[package]
name = "nenya"
version = "0.1.0"
edition = "2021"
description = "Adaptive rate limiting using PID control - library and distributed sidecar"
authors = ["Matthew Emerson <emersonmde@protonmail.com>"]
license = "MIT"
repository = "https://github.com/emersonmde/nenya"
readme = "README.md"
categories = ["algorithms", "web-programming"]
keywords = ["rate", "limit", "limiting", "throttling", "throttle"]

[dependencies]
# Library dependencies (always included)
num-traits = "0.2.19"
log = "0.4.21"

# Server/binary dependencies (optional - only when building binary)
axum = { version = "0.7", optional = true }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
toml = { version = "0.8", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
hostname = { version = "0.4", optional = true }
chitchat = { version = "0.10", optional = true }

[dev-dependencies]
clap = { version = "4.5.4", features = ["derive"] }
eframe = "0.28.1"
egui = "0.28.1"
egui_plot = "0.28.1"
proptest = "1.4"
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }
serial_test = "3.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "time"] }
serde_json = "1.0"

[features]
default = []
# Feature for building the server/binary
server = [
    "dep:axum",
    "dep:tokio",
    "dep:serde",
    "dep:serde_json",
    "dep:toml",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:hostname",
    "dep:chitchat",
]

[[bin]]
name = "nenya"
required-features = ["server"]

[[bench]]
name = "rate_limiter_bench"
harness = false

[[bench]]
name = "pid_controller_bench"
harness = false
